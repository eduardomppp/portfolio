<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrasilCard</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0d1117;
    color: #f0f0f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 40px 16px;
  }
  .logo {
    max-width: 180px;
    margin-bottom: 24px;
  }
  h1 {
    font-size: 1.8rem;
    margin: 0 0 8px;
    text-align: center;
  }
  p.subtitle {
    color: #a0a0a0;
    margin: 0 0 32px;
    text-align: center;
  }
  .video-wrapper {
    width: 100%;
    max-width: 900px;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }
  video, iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }
  footer {
    margin-top: 32px;
    color: #666;
    font-size: 0.85rem;
  }
</style>
</head>
<body>

  <img class="logo" src="7.jpeg" alt="BrasilCard">

  <h1>BrasilCard</h1>
  <p class="subtitle">Confira o vídeo abaixo</p>

  <div class="video-wrapper">
    <!-- Opção 1: vídeo hospedado no mesmo repositório (arquivo .mp4 na raiz) -->
    <video controls poster="7.jpeg">
      <source src="video.mp4" type="video/mp4">
      Seu navegador não suporta vídeo em HTML5.
    </video>

    <!-- Opção 2: se preferir YouTube/Vimeo, apague a tag <video> acima
         e descomente o iframe abaixo, trocando SEU_ID_AQUI -->
    <!--
    <iframe
      src="https://www.youtube.com/embed/SEU_ID_AQUI"
      title="Vídeo BrasilCard"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>
    -->
  </div>

  <footer>BrasilCard</footer>

</body>
</html>
